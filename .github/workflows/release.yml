# 推 v* tag 就在三个平台上构建并发 GitHub Release；手动触发只构建、产物留在 Actions 里。
# core 是 POSIX 的（proc.cpp 用 fork/poll/signal），Windows 只发 Go 写的 TUI 与 MCP 桥，连 WSL 里跑的 core。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: macos-arm64 }
          - { os: ubuntu-24.04, target: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: tui/go.mod, cache-dependency-path: tui/go.sum }

      - name: 工具链（macOS）
        if: runner.os == 'macOS'
        run: |
          brew install llvm ninja
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: 工具链（Linux）
        if: runner.os == 'Linux'
        run: |
          wget -q https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 22
          sudo apt-get install -y ninja-build libc++-22-dev libc++abi-22-dev libcurl4-openssl-dev libssl-dev
          echo "CXX=clang++-22" >> "$GITHUB_ENV"
          # libc++ 静态链进去：用户机器上不必有 libc++
          echo "CXXFLAGS=-stdlib=libc++" >> "$GITHUB_ENV"
          echo "LDFLAGS=-stdlib=libc++ -static-libstdc++" >> "$GITHUB_ENV"

      - name: 构建并测试
        env: { REVLM_TOKEN: "${{ secrets.REVLM_TOKEN }}" }
        run: |
          # revlm 是私有仓库：FetchContent 克隆它时带上只读 token
          git config --global url."https://x-access-token:${REVLM_TOKEN}@github.com/frevlm/revlm".insteadOf https://github.com/frevlm/revlm
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENSSL_USE_STATIC_LIBS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: 打包
        run: |
          d=realagent-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p $d/core
          cp build/realagent-tui build/realagent-mcp $d/
          cp build/core/realagent-core build/core/realontext $d/core/
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.target }}", path: "*.tar.gz" }

  windows:
    runs-on: windows-2025
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: tui/go.mod, cache-dependency-path: tui/go.sum }
      - name: 构建并打包
        run: |
          d=realagent-${{ github.ref_name }}-windows-x64
          mkdir -p $d
          cd tui
          go test ./...
          go build -o ../$d/realagent-tui.exe ./cmd/realagent-tui
          go build -o ../$d/realagent-mcp.exe ./cmd/realagent-mcp
          cd .. && 7z a $d.zip $d
      - uses: actions/upload-artifact@v4
        with: { name: windows-x64, path: "*.zip" }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unix, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: gh release create ${{ github.ref_name }} dist/* --title ${{ github.ref_name }} --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
